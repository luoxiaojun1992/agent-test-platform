name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test ./...

  web-test:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Run unit tests
        run: npm test

  ui-test:
    name: UI end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start the E2E stack
        run: bash ./web/e2e/stack.sh up
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: web
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "===== api.log ====="; cat .e2e/api.log 2>/dev/null || true
          echo "===== worker.log ====="; cat .e2e/worker.log 2>/dev/null || true
          echo "===== mock-target.log ====="; cat .e2e/mock-target.log 2>/dev/null || true
      - name: Tear down the E2E stack
        run: bash ./web/e2e/stack.sh down
        if: always()
