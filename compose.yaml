name: agent-test-platform

services:
  platform-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${PLATFORM_MYSQL_ROOT_PASSWORD:?set PLATFORM_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agent_test_platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: ${PLATFORM_MYSQL_PASSWORD:?set PLATFORM_MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${PLATFORM_MYSQL_PORT:-3307}:3306"
    volumes:
      - platform-mysql-data:/var/lib/mysql
      - ./migrations/0001_initial.sql:/docker-entrypoint-initdb.d/0001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [platform]

  target-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${TARGET_MYSQL_ROOT_PASSWORD:?set TARGET_MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${TARGET_MYSQL_PORT:-3309}:3306"
    volumes:
      - target-mysql-data:/var/lib/mysql
      - ./deployments/validation-mysql-init.sql:/docker-entrypoint-initdb.d/001_target_fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [target]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  mock-llm:
    build:
      context: .
      dockerfile: deployments/go.Dockerfile
      args:
        GO_PACKAGE: ./cmd/mock-llm
    environment:
      HTTP_ADDR: :8081
      MOCK_LLM_BEARER_TOKEN: ${MOCK_LLM_BEARER_TOKEN:?set MOCK_LLM_BEARER_TOKEN}
    ports:
      - "${MOCK_LLM_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [ollama]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [platform]

  mock-target:
    build:
      context: .
      dockerfile: deployments/go.Dockerfile
      args:
        GO_PACKAGE: ./cmd/mock-target
    environment:
      HTTP_ADDR: :8082
      MOCK_TARGET_BEARER_TOKEN: ${MOCK_TARGET_BEARER_TOKEN:?set MOCK_TARGET_BEARER_TOKEN}
      MOCK_TARGET_MODEL: ${MOCK_TARGET_MODEL:-mock-agent-v1}
      MOCK_TARGET_INDEX_DELAY: ${MOCK_TARGET_INDEX_DELAY:-2s}
    ports:
      - "${MOCK_TARGET_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [target]

  api:
    build:
      context: .
      dockerfile: deployments/go.Dockerfile
      args:
        GO_PACKAGE: ./cmd/api
    environment:
      HTTP_ADDR: :8080
      PLATFORM_MYSQL_DSN: platform:${PLATFORM_MYSQL_PASSWORD:?set PLATFORM_MYSQL_PASSWORD}@tcp(platform-mysql:3306)/agent_test_platform?parseTime=true&loc=UTC&charset=utf8mb4
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?set API_BEARER_TOKEN}
      GENERATOR_CONFIG_SHA256: ${GENERATOR_CONFIG_SHA256:?set GENERATOR_CONFIG_SHA256}
      SECRET_ENCRYPTION_KEY_ID: ${SECRET_ENCRYPTION_KEY_ID:-k1}
      SECRET_ENCRYPTION_KEY_IDS: ${SECRET_ENCRYPTION_KEY_IDS:-k1}
      ATP_ENCRYPTION_KEY_K1: ${ATP_ENCRYPTION_KEY_K1:?set ATP_ENCRYPTION_KEY_K1}
      REDIS_ADDR: redis:6379
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      platform-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  worker:
    build:
      context: .
      dockerfile: deployments/go.Dockerfile
      args:
        GO_PACKAGE: ./cmd/worker
    environment:
      PLATFORM_MYSQL_DSN: platform:${PLATFORM_MYSQL_PASSWORD:?set PLATFORM_MYSQL_PASSWORD}@tcp(platform-mysql:3306)/agent_test_platform?parseTime=true&loc=UTC&charset=utf8mb4
      # validation MySQL instances are registered through the API (Targets page); the worker reads them from Platform MySQL.
      WORKER_OWNER: generation-worker-compose
      SECRET_ENCRYPTION_KEY_ID: ${SECRET_ENCRYPTION_KEY_ID:-k1}
      SECRET_ENCRYPTION_KEY_IDS: ${SECRET_ENCRYPTION_KEY_IDS:-k1}
      ATP_ENCRYPTION_KEY_K1: ${ATP_ENCRYPTION_KEY_K1:?set ATP_ENCRYPTION_KEY_K1}
      GENERATION_MODEL_PROVIDER: ${GENERATION_MODEL_PROVIDER:-openai}
      GENERATION_MODEL_BASE_URL: ${GENERATION_MODEL_BASE_URL:-http://mock-llm:8081/v1}
      GENERATION_MODEL_API_TOKEN: ${GENERATION_MODEL_API_TOKEN:?set GENERATION_MODEL_API_TOKEN}
      GENERATION_MODEL_NAME: ${GENERATION_MODEL_NAME:-mock-generation-v1}
      GENERATION_MODEL_ALIAS: ${GENERATION_MODEL_ALIAS:-generation-primary}
      GENERATION_CONTEXT_WINDOW: ${GENERATION_CONTEXT_WINDOW:-32768}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-4096}
    depends_on:
      platform-mysql:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
      target-mysql:
        condition: service_healthy
    restart: unless-stopped
    networks: [platform, target]

  web:
    build:
      context: .
      dockerfile: deployments/Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

networks:
  platform:
    internal: false
  target:
    internal: false

volumes:
  platform-mysql-data:
  target-mysql-data:
  ollama-models:
